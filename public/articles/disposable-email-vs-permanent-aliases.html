    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');

          var supported = ['ar', 'en', 'es', 'fr', 'de', 'pt', 'it', 'ru', 'tr', 'zh', 'ja', 'ko', 'nl', 'pl', 'id', 'vi', 'hi', 'fa', 'ur', 'uk', 'bn', 'ms'];
          var p = localStorage.getItem('preferredLang');
          var userLang = (navigator.language || navigator.userLanguage || '').toLowerCase().split('-')[0];
          var targetLang = 'ar';
          if (p && supported.indexOf(p) !== -1) {
            targetLang = p;
          } else if (userLang && supported.indexOf(userLang) !== -1) {
            targetLang = userLang;
          }
          window.location.replace('/' + targetLang + '/articles/disposable-email-vs-permanent-aliases.html' + window.location.search + window.location.hash);
        } catch (e) {
          window.location.replace('/ar/articles/disposable-email-vs-permanent-aliases.html');
        }
      })();
    </script>
