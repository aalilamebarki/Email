<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الأسئلة الشائعة — FAQ | بريد مؤقت — Temp Mail</title>
    <link rel="canonical" href="https://freetemp.email/ar/faq.html" />
    <link rel="alternate" hreflang="ar" href="https://freetemp.email/ar/faq.html" />
    <link rel="alternate" hreflang="en" href="https://freetemp.email/en/faq.html" />
    <link rel="alternate" hreflang="x-default" href="https://freetemp.email/en/faq.html" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');

          var p = localStorage.getItem('preferredLang');
          var userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
          if (p === 'en' || (p && p !== 'ar') || (!p && !userLang.startsWith('ar'))) {
            window.location.replace('/en/faq.html' + window.location.search + window.location.hash);
          } else {
            window.location.replace('/ar/faq.html' + window.location.search + window.location.hash);
          }
        } catch (e) {
          window.location.replace('/ar/faq.html');
        }
      })();
    </script>
  </head>
  <body class="bg-white text-black dark:bg-[#0D0D0D] dark:text-[#F5F5F5] flex items-center justify-center min-h-screen font-sans">
    <div class="text-center p-6">
      <div class="w-8 h-8 border-2 border-black dark:border-white border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-xs text-neutral-500 font-mono">Redirecting...</p>
    </div>
  </body>
</html>
